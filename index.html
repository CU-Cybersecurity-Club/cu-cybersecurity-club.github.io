<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CU Cyber Club</title>

        <!-- DNS prefetch for external origins ooooh -->
        <link rel="dns-prefetch" href="https://discord.gg" />
        <link rel="dns-prefetch" href="https://github.com" />
        <link rel="dns-prefetch" href="https://www.gstatic.com" />

        <!-- Preconnect stuff -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://www.googleapis.com" />
        <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />

        <!-- CSS c: -->
        <link rel="stylesheet" href="css/style.css" />

        <!-- SEO -->
        <meta
            name="description"
            content="CU Boulder's cybersecurity club. Workshops, CTFs, networking. Any skill level welcome."
        />
        <meta property="og:title" content="CU Cyber Club" />
        <meta
            property="og:description"
            content="CU Boulder's cybersecurity club."
        />
        <meta property="og:type" content="website" />
    </head>

    <body>
        <!-- Nav :3 -->
        <div id="navbar">
            <div class="navbar-left">
                <span class="logo"
                    >cu<span class="dot">.</span>cyber<span class="dot">.</span
                    >club</span
                >
                <div class="workspaces">
                    <button
                        class="ws-btn active"
                        data-screen="0"
                        onclick="switchScreen(0)"
                    >
                        <span class="ws-num">1</span> Home
                    </button>
                    <button
                        class="ws-btn"
                        data-screen="1"
                        onclick="switchScreen(1)"
                    >
                        <span class="ws-num">2</span> Achievements
                    </button>
                </div>
            </div>
            <div class="navbar-right">
                <a href="#" class="btn btn-primary">Join Discord</a>
            </div>
        </div>

        <!-- Desktop -->
        <div id="desktop">
            <div id="screen-0" class="screen"></div>
            <div id="screen-1" class="screen"></div>
        </div>
        <script></script>
    </body>
</html>
